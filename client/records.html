<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records - Live Bug Tracker 3000</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐛 Live Bug Tracker 3000</h1>
            <p class="subtitle">Recording Sessions</p>
        </header>

        <nav class="main-nav">
            <a href="index.html" class="nav-link">📷 Cameras</a>
            <a href="records.html" class="nav-link active">📹 Records</a>
            <a href="files.html" class="nav-link">📁 Files</a>
            <a href="start.html" class="nav-link">▶️ Start Recording</a>
            <a href="settings.html" class="nav-link">⚙️ Settings</a>
            <a href="http://127.0.0.1:8080/swagger" class="nav-link" target="_blank">📚 API Docs</a>
        </nav>

        <main>
            <!-- Unified session log: records + calibrations with filter/sort controls -->
            <section class="session-section">
                <div class="section-header">
                    <h2>Session Log</h2>
                    <div class="header-controls">
                        <select id="session-filter" class="sort-select">
                            <option value="all">All</option>
                            <option value="records">📹 Records only</option>
                            <option value="calibrations">🎯 Calibrations only</option>
                        </select>
                        <select id="session-sort" class="sort-select">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                        </select>
                        <button id="refresh-all-btn" class="btn-refresh">🔄 Refresh</button>
                    </div>
                </div>

                <div id="session-loading" class="loading">Loading...</div>
                <div id="session-error" class="error" style="display: none;"></div>

                <div id="session-list" class="session-list"></div>
            </section>

        </main>

        <footer>
            <p>Connected to API: <span id="api-status" class="status-disconnected">Checking...</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
