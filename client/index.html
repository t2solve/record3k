<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bug Tracker 3000</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐛 Live Bug Tracker 3000</h1>
            <p class="subtitle">Camera Management & Monitoring</p>
        </header>

        <nav class="main-nav">
            <a href="index.html" class="nav-link active">📷 Cameras</a>
            <a href="records.html" class="nav-link">📹 Records</a>
            <a href="start.html" class="nav-link">▶️ Start Recording</a>
            <a href="http://127.0.0.1:8080/swagger" class="nav-link" target="_blank">📚 API Docs</a>
        </nav>

        <main>
            <section class="cameras-section">
                <div class="section-header">
                    <h2>Available Cameras</h2>
                    <div class="header-actions">
                        <button id="update-btn" class="btn-refresh" title="Update camera list on server (probe & persist)">🛰️ Update List</button>
                        <button id="refresh-btn" class="btn-refresh" title="Reload from API">🔄 Refresh</button>
                    </div>
                </div>
                
                <div id="loading" class="loading">Loading cameras...</div>
                <div id="error" class="error" style="display: none;"></div>
                
                <div id="camera-list" class="camera-grid"></div>
            </section>
        </main>

        <footer>
            <p>Connected to API: <span id="api-status" class="status-disconnected">Checking...</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
